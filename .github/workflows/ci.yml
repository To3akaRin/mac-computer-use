name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Build Swift
        run: bash scripts/build.sh
      - name: Swift tests
        run: swift test
      - name: Native self tests
        run: .build/release/NativeSelfTest
      - name: Protocol, launcher and installation tests
        run: npm test
      - name: Agent Skills reference validation
        run: |
          python3 -m venv "$RUNNER_TEMP/skills-ref"
          "$RUNNER_TEMP/skills-ref/bin/pip" install 'git+https://github.com/agentskills/agentskills.git@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref'
          "$RUNNER_TEMP/skills-ref/bin/skills-ref" validate "$GITHUB_WORKSPACE"
      - name: Skill package
        run: sh scripts/package.sh --output "$RUNNER_TEMP/mac-computer-use-0.2.0.zip"
      - name: Syntax and diff checks
        run: |
          node --check scripts/cdp.mjs
          node --check scripts/lib/cdp.mjs
          sh -n scripts/build.sh scripts/run.sh scripts/install.sh scripts/package.sh scripts/lib/package-common.sh
          git diff --check
